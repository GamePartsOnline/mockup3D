<div id="clientOrderModal" class="visual-edit-modal" hidden>
  <div class="visual-edit-dialog" style="max-width:580px; width:95vw;">
    <div class="visual-edit-header">
      <div>
        <strong style="font-size:16px; color:#0f172a;">Finaliser ma création et mes coordonnées</strong>
        <p style="margin:2px 0 0 0; font-size:12px; color:#64748b;">Renseignez vos coordonnées pour la transmission de votre commande à l'atelier.</p>
      </div>
      <button type="button" id="closeOrderModalBtn" class="close-explorer-btn" aria-label="Fermer">✕</button>
    </div>
    <form id="clientOrderForm" class="visual-edit-body" style="display:flex; flex-direction:column; gap:12px;" onsubmit="return false;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <label style="display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:#334155;">
          Nom *
          <input type="text" id="orderNom" required placeholder="Ex : Dupont" style="padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1; font-size:13px;" />
        </label>
        <label style="display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:#334155;">
          Prénom *
          <input type="text" id="orderPrenom" required placeholder="Ex : Marie" style="padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1; font-size:13px;" />
        </label>
      </div>
      <label style="display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:#334155;">
        Adresse postale *
        <input type="text" id="orderAdresse" required placeholder="Numéro et nom de rue" style="padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1; font-size:13px;" />
      </label>
      <div style="display:grid; grid-template-columns:120px 1fr; gap:10px;">
        <label style="display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:#334155;">
          Code Postal *
          <input type="text" id="orderCodePostal" required placeholder="Ex : 51100" style="padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1; font-size:13px;" />
        </label>
        <label style="display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:#334155;">
          Ville *
          <input type="text" id="orderVille" required placeholder="Ex : Reims" style="padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1; font-size:13px;" />
        </label>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <label style="display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:#334155;">
          Adresse e-mail *
          <input type="email" id="orderEmail" required placeholder="contact@exemple.fr" style="padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1; font-size:13px;" />
        </label>
        <label style="display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:#334155;">
          Numéro de téléphone *
          <input type="tel" id="orderTelephone" required placeholder="06 00 00 00 00" style="padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1; font-size:13px;" />
        </label>
      </div>
      <label style="display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:#334155;">
        Remarque ou instruction spécifique (facultatif)
        <textarea id="orderNote" rows="2" placeholder="Précision sur la quantité, le marquage ou la livraison…" style="padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1; font-size:12px; resize:vertical;"></textarea>
      </label>
      <div id="orderErrorMessage" style="display:none; color:#dc2626; font-size:12px; font-weight:600; background:#fef2f2; padding:8px 12px; border-radius:6px;"></div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button type="button" id="cancelOrderBtn" class="cat-btn-sm cat-btn-light" style="padding:8px 16px;">Annuler</button>
        <button type="button" id="confirmOrderSubmitBtn" class="cat-btn-sm cat-btn-primary" style="padding:8px 20px; font-weight:700;">Valider et envoyer la création</button>
      </div>
    </form>
  </div>
</div>

<div id="adminSubmissionsModal" class="visual-edit-modal" hidden>
  <div class="visual-edit-dialog" style="max-width:1150px; width:95vw; max-height:90vh; display:flex; flex-direction:column;">
    <div class="visual-edit-header" style="flex-shrink:0;">
      <div>
        <strong style="font-size:16px; color:#0f172a;">Créations et commandes clients reçues</strong>
        <p style="margin:2px 0 0 0; font-size:12px; color:#64748b;">Consultez les fichiers créés par les clients, leurs coordonnées complètes et l'état de traitement.</p>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <select id="adminSubFilter" style="padding:5px 8px; font-size:12px; border-radius:6px; border:1px solid #cbd5e1;">
          <option value="all">Toutes les créations</option>
          <option value="nouveau" selected>Nouveaux uniquement</option>
          <option value="traite">Traités uniquement</option>
        </select>
        <button type="button" id="refreshAdminSubBtn" class="cat-btn-sm cat-btn-light" title="Actualiser la liste">Actualiser</button>
        <button type="button" id="closeAdminSubmissionsBtn" class="close-explorer-btn" aria-label="Fermer">✕</button>
      </div>
    </div>
    <div id="adminSubmissionsList" style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px; background:#f8fafc;">
      <p style="text-align:center; color:#64748b; font-size:13px; margin:40px 0;">Chargement des commandes…</p>
    </div>
  </div>
</div>
