<header class="topbar">
  <div class="brand">
    <span class="logo-card"><img src="/logo-graph2print.png" alt="Graph2Print"></span>
    <div>
      <strong>MockUp3D</strong>
      <small>Graph2Print • Personnalisation 3D</small>
      <span id="modeLabel" class="mode-label"></span>
    </div>
    <nav class="app-menu-bar" aria-label="Menu principal">
      <div class="menu-dropdown">
        <button type="button" class="menu-dropdown-btn">Fichier ▾</button>
        <div class="menu-dropdown-content">
          <button type="button" id="menuFileImport">Importer une image…</button>
          <hr>
          <div style="padding:6px 16px; display:flex; flex-direction:column; gap:4px;">
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; color:#64748b;">Qualité d'export</span>
            <select id="exportResolution" class="topbar-select" title="Résolution de l'export" style="width:100%;">
              <option value="1">Standard (Écran 1×)</option>
              <option value="2" selected>HD (Catalogue 2×)</option>
              <option value="3">Ultra HD (Impression 3×)</option>
            </select>
          </div>
          <hr>
          <button type="button" id="exportPng">Exporter en image PNG</button>
          <button type="button" id="exportMp4">Exporter en vidéo MP4</button>
          <button type="button" id="exportMugViews">Exporter 3 faces (Mug)</button>
          <hr>
          <button type="button" id="exportAll" style="font-weight:700; color:#7c3aed;">Tout Exporter (PNG + MP4)</button>
        </div>
      </div>
      <div class="menu-dropdown">
        <button type="button" class="menu-dropdown-btn">Éditer ▾</button>
        <div class="menu-dropdown-content">
          <button type="button" id="menuEditResetImg">Réinitialiser le visuel actif</button>
          <button type="button" id="menuEditRepeat">Basculer le motif en mosaïque</button>
          <button type="button" id="menuEditFrame">Afficher / Masquer le cadre</button>
          <hr>
          <button type="button" id="menuEditResetText">Effacer le texte personnalisé</button>
        </div>
      </div>
      <div class="menu-dropdown">
        <button type="button" class="menu-dropdown-btn">Affichage ▾</button>
        <div class="menu-dropdown-content">
          <button type="button" id="themeToggle">Mode Nuit</button>
          <hr>
          <button type="button" id="menuViewShowcase">Le Showroom 3D (Tous les objets)</button>
          <button type="button" id="menuViewHome">Réinitialiser la vue 3D</button>
          <button type="button" id="menuViewSave" style="font-weight:700; color:#0284c7;">Sauvegarder la vue actuelle</button>
          <button type="button" id="menuViewClearSave">Oublier la vue sauvegardée</button>
          <hr>
          <button type="button" id="menuViewFaceA">Vue Face Avant (A)</button>
          <button type="button" id="menuViewFaceB">Vue Face Arrière / Côtés (B)</button>
        </div>
      </div>
      <div class="menu-dropdown">
        <button type="button" class="menu-dropdown-btn">Catalogue ▾</button>
        <div class="menu-dropdown-content">
          <button type="button" id="menuCatOpen">Parcourir les visuels</button>
          <button type="button" id="menuCatAdd">+ Ajouter un visuel au catalogue</button>
        </div>
      </div>
    </nav>
  </div>
  <div class="topbar-actions">
    <button type="button" class="btn-open-cgv client-only-legal" title="Conditions Générales de Vente" style="background:transparent; border:none; color:#64748b; font-size:11px; text-decoration:underline; cursor:pointer; padding:4px 6px;">CGV</button>
    <button type="button" class="btn-open-mentions client-only-legal" title="Mentions Légales" style="background:transparent; border:none; color:#64748b; font-size:11px; text-decoration:underline; cursor:pointer; padding:4px 6px;">Mentions Légales</button>
    <button type="button" id="clientThemeToggle" class="client-theme-toggle-btn" title="Basculer entre Mode Jour et Mode Nuit" style="display:none;">Mode Nuit</button>
    <label id="adminNoelDecorWrap" style="display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; border-radius:6px; padding:3px 8px; cursor:pointer;" title="Activer les décorations festives de Noël dans le Showroom 3D">
      <input type="checkbox" id="adminNoelDecorToggle" style="accent-color:#dc2626; cursor:pointer; width:14px; height:14px;" />
      <span>Mode Noël</span>
    </label>
    <button type="button" id="btnShowcaseTable" class="topbar-showcase-btn" title="Le Showroom 3D (Tous les objets sur la table)">Showroom 3D</button>
    <button type="button" id="btnShop2D" class="topbar-shop-btn" title="Ouvrir la Boutique 2D">Boutique 2D</button>
    <button type="button" id="btnClientAccount" class="topbar-btn outline" title="Consulter mes commandes et échanger avec l'atelier" style="font-weight:700; font-size:11.5px; padding:4px 10px; border-radius:6px; cursor:pointer;">Mon Espace</button>
    <span id="exportStatus" class="topbar-status" style="font-size:12px; color:#94a3b8; margin-right:8px;">Prêt</span>
    <select id="langSelect" class="lang-switch-select" title="Changer de langue / Switch language" style="background:#f1f5f9; border:1px solid #cbd5e1; border-radius:6px; font-weight:700; font-size:12px; padding:3px 6px; cursor:pointer;"><option value="fr">FR</option><option value="en">EN</option></select>
    <button type="button" id="btnAdminDashboard" class="topbar-btn primary" style="display:none; font-weight:700; background:#7c3aed;" title="Ouvrir le Tableau de bord de l'Atelier">Dashboard Atelier</button>
    <button type="button" id="btnAdminSubmissions" class="topbar-btn secondary" style="display:none; font-weight:700;" title="Consulter les créations et commandes reçues">Créations reçues (<span id="adminSubmissionsBadge">0</span>)</button>
    <a id="clientModeLink" class="client-mode-btn" href="/">Interface Client</a>
    <button id="submitCreation" class="topbar-btn primary client-submit" type="button" hidden>Envoyer ma création</button>
  </div>
</header>
