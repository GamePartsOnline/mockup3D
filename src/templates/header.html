<header class="topbar">
      <div class="brand"><span class="logo-card"><img src="/logo-graph2print.png" alt="Graph2Print"></span><div><strong>MockUp3D</strong><span id="localBadge" style="background:#f86900;color:white;padding:2px 6px;border-radius:4px;font-size:10px;margin-left:8px;vertical-align:middle;text-transform:uppercase;font-weight:bold;">Site en local</span><small>Présentation produit locale</small><span id="modeLabel" class="mode-label"></span></div></div>
      <div class="topbar-actions"><a id="clientModeLink" class="client-mode-link" href="/">Voir interface client</a>
        <div class="export-group">
          <select id="exportResolution" class="topbar-select" title="Résolution de l'export">
            <option value="1">Standard (Écran)</option>
            <option value="2" selected>HD (Catalogue 2×)</option>
            <option value="3">Ultra HD (Impression 3×)</option>
          </select>
          <button id="exportAll" class="topbar-btn primary mega-export" type="button" title="Exporter le PNG, la vidéo MP4 et les vues du mug en une fois">Tout Exporter</button>
          <button id="exportPng" class="topbar-btn secondary" type="button">PNG</button>
          <button id="exportMugViews" class="topbar-btn secondary mug-views-btn" type="button" title="Exporter automatiquement les 3 vues du mug">3 faces (Mug)</button>
          <button id="exportMp4" class="topbar-btn secondary mp4" type="button">MP4</button>
        </div>
        <span id="exportStatus" class="topbar-status">Prêt</span><button id="submitCreation" class="topbar-btn primary client-submit" type="button" hidden>Envoyer ma création</button>
      </div>
      <div class="privacy"><span></span> Envoi uniquement après validation <span style="margin-left:12px;opacity:0.6;">| v1.2.0</span></div>
    </header>
