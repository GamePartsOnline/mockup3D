<aside class="panel"><div class="drawer-heading"><strong>Atelier de création</strong><button type="button" data-close-panel="left" aria-label="Fermer le menu de gauche">✕</button></div>
        <div id="clientGuide" class="client-guide" hidden>
          <strong id="clientGuideTitle">Étape 1 · Choisir un produit</strong>
          <div class="client-timeline" role="progressbar" aria-label="Progression de création">
            <div class="timeline-track">
              <div class="timeline-fill" id="timelineProgressFill"></div>
            </div>
            <div class="timeline-step" data-guide-step="1" role="button" tabindex="0" title="Étape 1 : Choix du produit">
              <div class="step-bubble"><span class="step-num">1</span><span class="step-check">✓</span></div>
              <span class="step-label">Produit</span>
            </div>
            <div class="timeline-step" data-guide-step="2" role="button" tabindex="0" title="Étape 2 : Vos visuels">
              <div class="step-bubble"><span class="step-num">2</span><span class="step-check">✓</span></div>
              <span class="step-label">Visuel</span>
            </div>
            <div class="timeline-step" data-guide-step="3" role="button" tabindex="0" title="Étape 3 : Ajuster">
              <div class="step-bubble"><span class="step-num">3</span><span class="step-check">✓</span></div>
              <span class="step-label">Ajuster</span>
            </div>
            <div class="timeline-step" data-guide-step="4" role="button" tabindex="0" title="Étape 4 : Envoyer la création">
              <div class="step-bubble"><span class="step-num">4</span><span class="step-check">✓</span></div>
              <span class="step-label">Envoi</span>
            </div>
          </div>
          <button id="clientGuideAction" class="primary" type="button">Choisir ce produit</button>
        </div>
        <div style="display:none;">
          <select id="productSelect">
            <option value="showcase" selected>Le Showroom 3D</option>
            <option value="tshirt3D">T-shirt 3D</option>
            <option value="mug11oz">Mug blanc 11 oz</option>
            <option value="photoFrame">Poster A4</option>
            <option value="poster">Poster 80 × 60 cm</option>
            <option value="cushion">Housse de coussin</option>
            <option value="cap">Casquette 3D</option>
            <option value="mousePad">Tapis de souris</option>
            <option value="puzzle">Puzzle 120 pièces</option>
            <option value="pencilCase">Trousse</option>
            <option value="coaster">Sous-verre carré</option>
            <option value="coasterRound">Sous-verre rond</option>
            <option value="keychainRect">Porte-clés rectangle</option>
            <option value="keychainRound">Porte-clés rond</option>
            <option value="keychainHeart">Porte-clés Cœur</option>
            <option value="eventWristband">Bracelet événementiel</option>
            <option value="arcadeCabinet">Borne d'Arcade</option>
          </select>
          <small id="productDimensions"></small>
          <div id="productPriceContainer"><span id="productPrice"></span></div>
          <label id="tshirtOrientationWrap"><select id="tshirtOrientation"><option value="portrait">Portrait</option><option value="landscape">Paysage</option></select></label>
        </div>
        <div id="activeProductBanner" style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:8px 12px; border-radius:8px; margin-bottom:12px; border:1px solid #e2e8f0;">
          <div><small style="color:#64748b; font-size:10px; font-weight:700; text-transform:uppercase;">Objet sélectionné</small><strong id="activeProductName" style="display:block; font-size:13px; color:#0f172a;">Le Showroom 3D</strong></div>
          <button type="button" id="btnChangeProductShop" class="cat-btn-sm" style="background:#8b5cf6; color:#fff; font-weight:700; padding:5px 10px;">Changer</button>
        </div>
        <section id="sectionImages" class="collapsible-section" data-section="2">
          <button type="button" class="section-title-btn" aria-expanded="true">
            <div class="section-title"><span>1</span><h2>Vos visuels</h2></div>
            <span class="collapse-icon">▾</span>
          </button>
          <div class="section-content">
            <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;">
              <button type="button" id="openCatalogBtn" class="primary" style="display:flex; align-items:center; justify-content:center; gap:8px; background:#0ea5e9; font-weight:700; padding:10px; font-size:12px;">
                Parcourir le catalogue de visuels
              </button>
              
              <label class="upload" for="imageInput" style="padding:12px 10px; cursor:pointer;">
                <strong>Importer</strong>
                <small>PNG, JPG ou SVG (sélectionnez une ou plusieurs)</small>
              </label>
              <input id="imageInput" type="file" accept="image/png,image/jpeg,image/svg+xml" multiple style="display:none;" />
            </div>

            <button id="loadTshirtExample" class="secondary" type="button" hidden>Voir un exemple sur le T-shirt</button><div id="imagesList" class="images-list"></div>
          </div>
        </section>
        <section id="adjustments" class="collapsible-section disabled" data-section="3">
          <button type="button" class="section-title-btn" aria-expanded="true">
            <div class="section-title"><span>3</span><h2>Ajuster</h2></div>
            <span class="collapse-icon">▾</span>
          </button>
          <div class="section-content">
            <div class="layer-header" id="activeImageLabel">Aucune image active</div>
            <div class="segmented" role="group" aria-label="Mode d’ajustement">
              <button class="active" data-fit="contain">Image entière</button><button data-fit="cover">Remplir la surface</button><button data-fit="fill">Plein wrap (Étirer)</button>
            </div>
            <label class="frame-option"><input id="showTransformFrame" type="checkbox" checked> Cadre d'ajustement direct (Drag & Drop)</label>
            <div style="font-size:11px; color:#6d28d9; background:#f5f3ff; border:1px solid #ddd6fe; border-radius:6px; padding:6px 10px; margin:4px 0 8px;">Glissez-déplacez votre visuel directement à la souris sur l'objet.</div>
            <label class="frame-option"><input id="showWatermark" type="checkbox"> Filigrane sous le visuel (en fond)</label>
            <label class="frame-option"><input id="repeatPattern" type="checkbox"> Répéter en motif (Mosaïque)</label>
            <div id="repeatCountControl" hidden>
              <label class="control" style="margin:6px 0 10px;"><span>Densité du motif <output id="repeatCountValue">3 × 3</output></span><input id="repeatCount" type="range" min="2" max="8" value="3" /></label>
            </div>
            <label class="control"><span>Taille <output id="scaleValue">100 %</output></span><input id="scale" type="range" min="20" max="250" value="100" /></label>
            <label class="control"><span>Rotation <output id="rotationValue">0°</output></span><input id="rotation" type="range" min="-180" max="180" value="0" /></label>
            <details style="margin:6px 0 4px; font-size:11px; color:#64748b; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:6px 10px;">
              <summary style="cursor:pointer; font-weight:700; color:#475569;">Réglage fin de position (Sliders)</summary>
              <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
                <label class="control"><span>Position horizontale <output id="posXValue">0 %</output></span><input id="posX" type="range" min="-100" max="100" value="0" /></label>
                <label class="control"><span>Position verticale <output id="posYValue">0 %</output></span><input id="posY" type="range" min="-100" max="100" value="0" /></label>
              </div>
            </details>
            <button id="resetImage" class="text-button">Réinitialiser l'image active</button>
          </div>
        </section>
        <section id="textSection" class="collapsible-section" data-section="4">
          <button type="button" class="section-title-btn" aria-expanded="true">
            <div class="section-title"><span>4</span><h2>Texte personnalisé</h2></div>
            <span class="collapse-icon">▾</span>
          </button>
          <div class="section-content">
            <label class="control">
              <span>Texte (multiligne)</span><select id="textSideSelect" style="margin-left:10px; font-size:11px; padding:2px; background:#28313a; color:#fff; border:1px solid #425260;"><option value="both">2 faces</option><option value="A">Face A</option><option value="B">Face B</option></select>
              <textarea id="customText" rows="3" placeholder="Votre texte ici…" autocomplete="off"></textarea>
            </label>
            <div class="text-format-bar">
              <div class="segmented segmented-mini" role="group" aria-label="Alignement du texte">
                <button type="button" class="align-btn" data-align="left" title="Aligner à gauche">Gauche</button>
                <button type="button" class="align-btn active" data-align="center" title="Centrer">Centré</button>
                <button type="button" class="align-btn" data-align="right" title="Aligner à droite">Droite</button>
              </div>
              <label class="option-check mini-check">
                <input id="textBold" type="checkbox"> <strong>Gras</strong>
              </label>
              <label class="option-check mini-check">
                <input id="textItalic" type="checkbox"> <em>Italique</em>
              </label>
            </div>
            <div class="color-grid">
              <label><input id="textColor" type="color" value="#111820"><span>Couleur</span></label>
              <label>
                <span>Police</span>
                <select id="textFont">
                  <optgroup label="Sans-Serif & Modernes">
                    <option value="Inter, sans-serif">Inter</option>
                    <option value="Montserrat, sans-serif">Montserrat</option>
                    <option value="Roboto, sans-serif">Roboto</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
                  </optgroup>
                  <optgroup label="Titres & Impact">
                    <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
                    <option value="Oswald, sans-serif">Oswald</option>
                    <option value="Impact, sans-serif">Impact</option>
                    <option value="Righteous, cursive">Righteous</option>
                  </optgroup>
                  <optgroup label="Manuscrites & Calligraphie">
                    <option value="'Dancing Script', cursive">Dancing Script</option>
                    <option value="Pacifico, cursive">Pacifico</option>
                    <option value="'Great Vibes', cursive">Great Vibes</option>
                    <option value="Caveat, cursive">Caveat</option>
                    <option value="Satisfy, cursive">Satisfy</option>
                    <option value="Lobster, cursive">Lobster</option>
                    <option value="'Comic Sans MS', cursive">Comic Sans</option>
                  </optgroup>
                  <optgroup label="Serif & Élégance">
                    <option value="'Playfair Display', serif">Playfair Display</option>
                    <option value="Cinzel, serif">Cinzel</option>
                    <option value="Georgia, serif">Georgia</option>
                    <option value="'Times New Roman', serif">Times</option>
                    <option value="'Courier New', monospace">Courier</option>
                  </optgroup>
                </select>
              </label>
            </div>
            <label class="control">
              <span>Taille <output id="textSizeValue">60 px</output></span>
              <input id="textSize" type="range" min="16" max="220" value="60" />
            </label>
            <label class="control"><span>Position horizontale <output id="textPosXValue">0 %</output></span><input id="textPosX" type="range" min="-100" max="100" value="0" /></label>
            <label class="control"><span>Position verticale <output id="textPosYValue">0 %</output></span><input id="textPosY" type="range" min="-100" max="100" value="0" /></label>
            <label class="control"><span>Rotation <output id="textRotationValue">0°</output></span><input id="textRotation" type="range" min="-180" max="180" value="0" /></label>
            <button id="resetText" class="text-button" type="button">Effacer le texte</button>
          </div>
        </section>
